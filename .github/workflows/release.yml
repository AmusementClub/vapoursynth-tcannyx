name: Release

on:
  workflow_dispatch:
  push:
    tags: ['r*']

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One plugin per platform with every backend it can have. The CUDA runtime is linked statically, so the
          # x64 plugins load without CUDA installed; arm64 and macOS are CPU only (the GPU entry points are stubs).
          - os: ubuntu-24.04
            name: linux-x64
            vulkan: true
            cuda: true
          - os: windows-2025
            name: windows-x64
            vulkan: true
            cuda: true
          - os: ubuntu-24.04-arm
            name: linux-arm64
            vulkan: false
            cuda: false
          - os: macos-latest
            name: macos-arm64
            vulkan: false
            cuda: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache pkg-config glslang-tools
          python -m pip install meson==1.8.3 ninja==1.11.1.3
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: python -m pip install meson==1.8.3 ninja==1.11.1.3
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install meson==1.8.3 ninja==1.11.1.3
          choco install ccache -y
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Restore Vulkan headers
        if: matrix.vulkan
        id: vulkan-headers
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vulkan-headers
          key: vulkan-headers-vulkan-sdk-1.4.363.0-${{ runner.os }}
      - name: Fetch Vulkan headers
        if: matrix.vulkan
        shell: bash
        run: |
          # VSVulkan4.h needs Vulkan 1.4 headers (vkCmdPushConstants2, vkMapMemory2, ...); distro and vcpkg copies lag.
          # Outside the checkout: meson rejects an absolute include path inside the source tree.
          if [ ! -f "$RUNNER_TEMP/vulkan-headers/include/vulkan/vulkan_core.h" ]; then
            git clone --depth 1 --branch vulkan-sdk-1.4.363.0 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vulkan-headers"
          fi
          dir="$RUNNER_TEMP/vulkan-headers/include"
          if [ "$RUNNER_OS" = "Windows" ]; then dir="$(cygpath -m "$dir")"; fi
          echo "VULKAN_HEADERS_DIR=$dir" >> "$GITHUB_ENV"
      - name: Install CUDA toolkit
        if: matrix.cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.1'  # 12.x rejects the runner's Visual Studio 2026 (MSVC 14.5x)
          # Only what the build needs (nvcc and the runtime), not the full toolkit; the action caches its downloads.
          method: network
          sub-packages: ${{ runner.os == 'Windows' && '["nvcc", "crt", "nvvm", "cudart", "visual_studio_integration"]' || '["nvcc", "cudart", "cudart-dev"]' }}
          use-github-cache: true
      - name: Install VapourSynth SDK
        shell: bash
        run: python -m pip install 'vapoursynth>=80' numpy
      - name: Validate release version
        shell: bash
        run: |
          project_version="$(sed -n "s/^project('TCanny', 'cpp', version: '\([^']*\)'.*/\1/p" meson.build)"
          test -n "$project_version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#r}"
            if [ "$tag_version" != "$project_version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match meson.build version '${project_version}'"
              exit 1
            fi
          fi
          # Packages are named after the project version, so a manual run from a branch builds the same names.
          echo "RELEASE=r${project_version}" >> "$GITHUB_ENV"
      - name: Build release
        shell: bash
        run: |
          # Git Bash puts its own /usr/bin/link.exe before MSVC's; meson must find the MSVC linker.
          if [ "$RUNNER_OS" = "Windows" ]; then export PATH="$(dirname "$(command -v cl)"):$PATH"; fi
          vulkan_opt=''
          if [ -n "${VULKAN_HEADERS_DIR:-}" ]; then vulkan_opt="-Dvulkan_headers=$VULKAN_HEADERS_DIR"; fi
          # Highway always from the pinned wrap, linked statically: the artifact must not depend on a system libhwy.
          meson setup build -Dcuda=${{ matrix.cuda }} -Dvulkan=${{ matrix.vulkan }} -Dtests=true -Dbuildtype=release --force-fallback-for=libhwy $vulkan_opt
          meson compile -C build
          meson test -C build --print-errorlogs
          if [ "${{ runner.os }}" = "Linux" ]; then for g in TCanny/shaders/*.comp.glsl; do glslangValidator -V -S comp $g -o /tmp/$(basename $g).spv; done; fi
          {
            echo "version=${RELEASE}"
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS} ${RUNNER_ARCH}"
            echo "meson=$(meson --version)"
            echo "vapoursynth=$(python -c 'import vapoursynth as v; print(getattr(v, "__api_version__", "R80+"))')"
            echo "vulkan=${{ matrix.vulkan }}"
            echo "cuda=${{ matrix.cuda }}"
            if [ "${{ matrix.cuda }}" = "true" ]; then echo "cuda_archs=$(meson introspect --buildoptions build | python -c 'import json, sys; print(" ".join(next(o["value"] for o in json.load(sys.stdin) if o["name"] == "nvcc_archs")))')"; fi
            if command -v nvcc >/dev/null 2>&1; then nvcc --version | tail -n 1; fi
          } > BUILD-METADATA.txt
      - name: Check plugin dependencies
        shell: bash
        run: |
          # All-in-one: the plugin may only depend on the system C/C++ runtime, never on the CUDA runtime or a Vulkan
          # loader (VapourSynth provides the Vulkan dispatch).
          if [ "$RUNNER_OS" = "Linux" ]; then
            deps="$(readelf -d build/libtcannyx.so | grep NEEDED)"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            deps="$(otool -L build/libtcannyx.dylib)"
          else
            deps="$(MSYS_NO_PATHCONV=1 dumpbin /dependents build/tcannyx.dll)"
          fi
          echo "$deps"
          if echo "$deps" | grep -iqE 'cudart|nvcuda|libcuda|vulkan'; then echo "::error::unexpected GPU runtime dependency"; exit 1; fi
      - name: Package
        shell: bash
        run: |
          sha256sum() { if command -v sha256sum >/dev/null 2>&1; then command sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          pkg="tcannyx-${RELEASE}-${{ matrix.name }}"
          mkdir -p "dist/${pkg}"
          find build -maxdepth 1 -type f \( -name '*.so' -o -name '*.dll' -o -name '*.dylib' \) -exec cp {} "dist/${pkg}/" \;
          cp README.md LICENSE BUILD-METADATA.txt "dist/${pkg}/"
          # Both archive types hold one top-level folder named after the package.
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && 7z a "../${pkg}.zip" "${pkg}" >/dev/null)
            sha256sum "${pkg}.zip" > "${pkg}.sha256"
          else
            tar -C dist -czf "${pkg}.tar.gz" "${pkg}"
            sha256sum "${pkg}.tar.gz" > "${pkg}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.tar.gz
            *.sha256
            *.zip

  publish:
    needs: package
    # A manual run only builds the packages; a release tag creates a draft release.
    if: startsWith(github.ref, 'refs/tags/r')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create aggregate checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Release notes
        shell: bash
        run: |
          # .github/release-notes/<tag>.md goes above GitHub's generated changelog; without one, only the changelog.
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" "$RUNNER_TEMP/notes.md"; else : > "$RUNNER_TEMP/notes.md"; fi
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # A draft is visible only to maintainers; review it and press Publish on GitHub.
          draft: true
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: dist/**
